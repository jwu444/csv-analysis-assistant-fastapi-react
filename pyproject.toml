[tool.poetry]
name = "csv-analysis-assistant"
version = "0.1.0"
description = "Upload a CSV, ask questions, get plots + stats + LLM interpretation"
authors = ["WavePoint"]
readme = "README.md"
packages = [{ include = "app", from = "backend" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
sqlalchemy = "^2.0"
pandas = "^2.2"
pydantic = "^2.8"
pydantic-settings = "^2.4"
python-multipart = "^0.0.9"
psycopg2-binary = "^2.9.12"
matplotlib = "^3.9"
seaborn = "^0.13"
anthropic = "^0.40"
alembic = "^1.18.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"
ruff = "^0.6"
black = "^24.8"
mypy = "^1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-generated migrations are machine-written and routinely exceed the line
# limit; env.py (hand-written) stays linted.
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# FastAPI relies on calling Depends()/File()/etc. in argument defaults; exempt
# them from flake8-bugbear B008 ("function call in default argument").
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "backend/alembic/versions"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
